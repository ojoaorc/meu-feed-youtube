<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src '__SCRIPT_HASH__'; style-src 'unsafe-inline'; frame-src https://www.youtube.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex">
<title>Player</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<script>
// Página intermediária: o YouTube exige um Referer válido no embed e, no iPhone, a página principal
// nem sempre consegue mandá-lo (erro 153). Esta página, servida pelo próprio site, embute o player.
(function () {
  var v = new URLSearchParams(location.search).get('v') || '';
  if (!/^[A-Za-z0-9_-]{11}$/.test(v)) return;
  var f = document.createElement('iframe');
  f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
  f.setAttribute('allowfullscreen', '');
  f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  f.src = 'https://www.youtube.com/embed/' + v + '?autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&origin=' + encodeURIComponent(location.origin);
  document.body.appendChild(f);
})();
</script>
</body>
</html>
