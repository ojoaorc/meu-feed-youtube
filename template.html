<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu feed 🏴‍☠️</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src '__SCRIPT_HASH__'; style-src 'unsafe-inline'; img-src 'self' https://i.ytimg.com https://yt3.googleusercontent.com https://yt3.ggpht.com data:; frame-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#15102a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fff6e5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu feed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#15102a;--bg2:#1d1738;--card:#231c44;--card2:#2b2354;--fg:#f6f1ff;--muted:#a79ec6;--line:#352b5e;
    --accent:#ff2e88;--accent2:#ff7ab8;--lime:#b6ff3b;--cyan:#2ee6ff;--yellow:#ffd60a;
    --chip:#2a2254;--chipfg:#d9d0f5;--chipon:#b6ff3b;--chiponfg:#12101c;
    --shadow:0 12px 34px rgba(255,46,136,.18);--r:16px;
  }
  :root[data-theme=light]{
    --bg:#fff6e5;--bg2:#fffdf8;--card:#fff;--card2:#fff1d6;--fg:#1d1340;--muted:#6e6590;--line:#f0e2c6;
    --chip:#ffe9c7;--chipfg:#4a3f6e;--chipon:#1d1340;--chiponfg:#b6ff3b;--shadow:0 12px 34px rgba(255,46,136,.14);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:radial-gradient(1200px 500px at 10% -10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%),radial-gradient(900px 400px at 100% 0,color-mix(in srgb,var(--cyan) 12%,transparent),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;color:inherit}

  header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px}
  .top{display:flex;align-items:center;gap:14px;padding:12px 0 8px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
  .logo img{width:30px;height:30px;border-radius:9px}
  .logo span:first-of-type{background:linear-gradient(90deg,var(--accent),var(--yellow) 60%,var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
  .count{color:var(--muted);font-weight:500;font-size:13px}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;min-width:0}
  .search:focus-within{border-color:var(--lime);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
  .search svg{flex:none;opacity:.6}
  .search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);outline:0;font-size:15px}
  .search kbd{font:11px/1 ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 5px}
  .icon{border:1px solid var(--line);background:var(--bg2);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
  .icon:hover{border-color:var(--muted)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0}
  [hidden]{display:none!important}
  @media (max-width:760px){
    .scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);margin-right:-12px;padding-right:24px}
    .scroll::-webkit-scrollbar{display:none}
    .scroll .chip{flex:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .row:last-child{padding-bottom:12px}
  .chip{border:0;border-radius:999px;padding:6px 12px;background:var(--chip);color:var(--chipfg);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .08s,background .15s}
  .chip:hover{transform:translateY(-1px) rotate(-1deg)}
  .chip.on{background:var(--chipon);color:var(--chiponfg)}
  .chip.new-f.on{background:var(--accent);color:#fff}
  .chip:active{transform:scale(.96)}
  .chip img{width:20px;height:20px;border-radius:50%;object-fit:cover;background:var(--line)}
  .chip .n{opacity:.6;font-weight:500}
  .sep{flex:1}
  .meta{color:var(--muted);font-size:12px}
  .meta b{color:var(--lime);font-weight:700}
  .warn{color:var(--yellow);cursor:help;border-bottom:1px dotted}

  main{max-width:1240px;margin:0 auto;padding:18px 20px 80px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px 18px}
  .day{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-size:12px;font-weight:800;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
  .day::after{content:"";flex:1;height:0;border-top:2px dashed color-mix(in srgb,var(--yellow) 55%,transparent)}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .card{animation:pop .35s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*28ms);background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative;border:1px solid var(--line);transition:transform .15s,box-shadow .15s,opacity .2s}
  .card:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
  .card.seen{opacity:.5}
  .card.seen:hover{opacity:.85}
  .thumb{position:relative;display:block;aspect-ratio:16/9;background:#000;overflow:hidden;cursor:pointer;border:0;padding:0;width:100%}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  .card:hover .thumb img{transform:scale(1.04)}
  .thumb .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .15s;background:rgba(0,0,0,.25)}
  .thumb:hover .play{opacity:1}
  .thumb .play span{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--yellow));display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .thumb .play span::after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
  .short{position:absolute;top:10px;right:10px;background:var(--cyan);color:#12101c;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
  .new{position:absolute;top:10px;left:10px;background:var(--lime);color:#12101c;font-size:11px;font-weight:900;padding:3px 9px;border-radius:7px;letter-spacing:.06em;transform:rotate(-4deg);box-shadow:0 3px 10px rgba(0,0,0,.3)}
  .body{padding:12px 14px 12px;display:flex;gap:10px;flex:1}
  .body img{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;background:var(--line);margin-top:2px}
  .txt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .title{font-weight:650;font-size:15px;line-height:1.3;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;background:none;border:0;text-align:left;padding:0}
  .title:hover{color:var(--yellow)}
  .sub{color:var(--muted);font-size:13px}
  .actions{margin-top:auto;padding-top:8px;display:flex;gap:14px}
  .actions button,.actions a{border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;padding:0;text-decoration:none}
  .actions button:hover,.actions a:hover{color:var(--fg)}
  .empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:80px 0;font-size:16px}
  mark{background:color-mix(in srgb,var(--yellow) 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}

  /* player */
  .modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:20px}
  .modal.open{display:flex}
  .player{width:min(1100px,100%);background:var(--bg2);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .player .frame{aspect-ratio:16/9;background:#000}
  .player iframe{width:100%;height:100%;border:0;display:block}
  .player .pbar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
  .player .pbar .sub{flex-basis:100%;margin-top:-4px}
  .nav{display:flex;gap:6px}
  .nav .btn{padding:8px 10px}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.on{background:var(--lime);color:#12101c;border-color:var(--lime)}
  @media (max-width:640px){.modal{padding:0;align-items:flex-start}.player{border-radius:0 0 16px 16px}.player .pbar h2{white-space:normal;font-size:15px}}
  .player .pbar h2{font-size:16px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .modal{background:rgba(21,16,42,.9)}
  .btn.danger{color:var(--accent2)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:40;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:640px){.logo span{display:none}.search kbd{display:none}.grid{gap:16px 12px}main{padding:12px 12px 80px}.wrap{padding:0 12px}}

  /* Mais espaço para assistir; movimento só quando ajuda. */
  body{font-size:16px}
  button,a,input{-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:3px solid var(--accent2);outline-offset:4px}
  .chip,.btn,.icon{min-height:44px;font-size:14px}
  .icon{width:44px;height:44px}
  .search input{font-size:16px}
  .search{min-height:44px}
  .row{gap:6px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
  .card{animation:none;transition:transform .18s,box-shadow .18s,border-color .18s}
  .card.seen{opacity:.65}
  .title{font-size:16px;line-height:1.45}
  .actions{gap:8px;flex-wrap:wrap}
  .actions button,.actions a{min-height:40px;display:inline-flex;align-items:center;font-size:13px}
  .new,.short{z-index:1;pointer-events:none}
  .feed-intro{display:flex;justify-content:space-between;align-items:center;padding:22px 0 18px;gap:20px}
  .eyebrow{font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--accent2)}
  .feed-intro h1{font-size:clamp(24px,4vw,38px);letter-spacing:-.045em;line-height:1.12;margin:8px 0}
  .feed-intro p{color:var(--muted);margin:0;font-size:14px}
  .pirate-stamp{display:grid;place-items:center;width:66px;height:66px;flex:none;background:var(--card);border:1px dashed var(--accent2);border-radius:22px;transform:rotate(8deg);font-size:32px}
  .result-summary{font-size:13px;color:var(--muted);margin:8px 0 20px}
  .empty{padding:48px 16px;background:var(--card);border:1px dashed var(--line);border-radius:20px}
  .empty p{font-size:14px}
  .toast{max-width:calc(100vw - 32px);width:max-content;white-space:normal;text-align:center;bottom:calc(20px + env(safe-area-inset-bottom))}
  :root[data-theme=light]{--accent2:#a62266;--yellow:#7a5100}
  :root[data-theme=light] .meta b{color:#386016}
  .modal{overflow-y:auto;padding:20px}
  .player{max-height:calc(100dvh - 40px);overflow:auto}
  .player .pbar h2{flex-basis:100%;white-space:normal;line-height:1.4}
  @media(hover:none){.card:hover,.chip:hover{transform:none}.card:hover .thumb img{transform:none}}
  @media(max-width:760px){
    header{position:relative;padding-top:env(safe-area-inset-top)}
    .top{gap:8px}.logo{gap:0}.logo img{width:34px;height:34px}
    .row.scroll{mask-image:none;scroll-padding:12px}
    .feed-intro{padding:18px 0 12px}.pirate-stamp{width:50px;height:50px;font-size:26px}
    .modal{padding:12px;padding-top:max(12px,env(safe-area-inset-top));align-items:center}
    .player{border-radius:16px;max-height:calc(100dvh - 40px)}
  }
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}


  .filter-panel{padding:2px 0 6px}
  .filter-panel summary{cursor:pointer;width:fit-content;min-height:44px;display:list-item;padding:10px 6px;font-size:14px;font-weight:650;color:var(--fg);margin-left:16px}
  .filter-options{padding:6px 0 12px}
  .filter-options .sep{display:none}
  .player-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg2);padding:8px 12px;border-bottom:1px solid var(--line)}
  .player-top span{font-size:13px;color:var(--muted)}
  .modal{overscroll-behavior:contain;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .player{max-height:calc(100svh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overscroll-behavior:contain}
  .player .frame{width:100%;max-height:62svh}
  @media(max-width:760px),(max-height:500px),(hover:none) and (pointer:coarse){
    header{position:relative;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;transition:none}
    body{background-attachment:scroll}
    .wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
    .period-row,.filter-options{flex-wrap:wrap;overflow:visible}
    .filter-options .chip{min-height:44px}
    .player{max-height:calc(100svh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
  }
  @media(orientation:landscape) and (max-height:500px){
    .modal{align-items:flex-start}
    .player .frame{max-height:calc(100svh - 100px)}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo"><img src="icon.svg" alt=""><span>Meu feed</span> <span class="count" id="count"></span></div>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" aria-label="Buscar vídeos" type="search" placeholder="Qual tesouro vamos ver?" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <button class="icon" id="theme" title="Tema claro/escuro" aria-label="Tema">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <div class="row scroll" id="channels"></div>
    <div class="row period-row">
      <button class="chip new-f" id="onlyNew" hidden>Novos <span class="n" id="newN"></span></button>
      <button class="chip on" data-range="14">2 semanas</button>
      <button class="chip" data-range="60">2 meses</button>
      <button class="chip" data-range="0">Tudo</button>
    </div>
    <details class="filter-panel"><summary>Ajustar feed</summary><div class="row filter-options">
      <button class="chip" id="toggleShorts">Shorts</button>
      <button class="chip" id="toggleApp" title="Onde abrir os vídeos">Abrir: aqui</button>
      <span class="sep"></span>
      <button class="chip" id="toggleSeen">Ocultar vistos</button>
      <button class="chip" id="markAll">Marcar tudo como visto</button>
    </div>
    </details>
    <div class="row secondary"><div class="meta" id="meta"></div></div>
  </div>
</header>

<main><div class="feed-intro"><div><span class="eyebrow">SEU PEQUENO PORTO</span><h1>Bom vento. Bons vídeos.</h1><p>Só os canais que você escolheu. Você no leme.</p></div><span class="pirate-stamp" aria-hidden="true">🏴‍☠️</span></div><p id="resultSummary" class="result-summary" role="status"></p><div class="grid" id="grid"></div><div style="text-align:center;margin-top:28px"><button class="btn" id="more" hidden>Mostrar mais</button></div></main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="player">
    <div class="player-top"><span>A bordo · sessão de vídeo</span><button class="btn" id="pclose" aria-label="Fechar vídeo" title="Fechar (Esc)">Fechar</button></div>
    <div class="frame"><iframe title="Reprodutor do vídeo" id="frame" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div class="pbar">
      <h2 id="ptitle"></h2>
      <div class="nav"><button class="btn" id="pprev" aria-label="Vídeo anterior" title="Anterior (←)">Anterior</button><button class="btn" id="pnext" aria-label="Próximo vídeo" title="Próximo (→)">Próximo</button></div>
      <a class="btn" id="popen" target="_blank" rel="noopener">YouTube ↗</a>
      <div class="sub" id="psub"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script id="feed" type="application/json">__FEED_JSON__</script>
<script>
(function(){
  const feed = JSON.parse(document.getElementById('feed').textContent);
  const $ = s => document.querySelector(s);
  const LS = { seen:'yf.seen', last:'yf.lastVisit', hide:'yf.hideSeen', ch:'yf.channels', theme:'yf.theme', shorts:'yf.shorts', range:'yf.range', auto:'yf.autonext', open:'yf.open' };
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); } catch(e){ return d; } };
  const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---- estado
  let seen = new Set(get(LS.seen, []));
  const lastVisit = get(LS.last, 0);
  let hideSeen = get(LS.hide, false);
  const allIds = feed.channels.map(c => c.channel_id).filter(Boolean);
  let active = new Set(get(LS.ch, allIds).filter(id => allIds.includes(id)));
  if (!active.size) active = new Set(allIds);
  let rangeDays = get(LS.range, 14), query = '', showShorts = get(LS.shorts, false), limit = 120, onlyNew = false;
  // No iPhone/iPad o WebKit bloqueia os cookies do YouTube dentro de players embutidos (sem login, sem Premium).
  // Lá, o padrão é abrir o vídeo no app do YouTube; o chip "Abrir" troca a qualquer hora.
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let openExt = get(LS.open, isIOS ? 'app' : 'aqui') === 'app';
  const isNewV = v => lastVisit && new Date(v.published) > lastVisit && !seen.has(v.id);
  const now = Date.now();
  addEventListener('pagehide', () => set(LS.last, now));

  // ---- tema
  const applyTheme = t => { document.documentElement.dataset.theme = t; };
  let theme = get(LS.theme, matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyTheme(theme);
  $('#theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; set(LS.theme, theme); applyTheme(theme); };

  // ---- util
  const fmtDate = iso => { const d = new Date(iso), today = new Date(now); const diff = Math.round((new Date(today.getFullYear(),today.getMonth(),today.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate())) / 864e5);
    if (diff === 0) return 'Hoje'; if (diff === 1) return 'Ontem';
    return d.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'}); };
  const ago = iso => { const h = Math.round((now - new Date(iso)) / 36e5);
    return h < 1 ? 'agora' : h < 24 ? `há ${h} h` : h < 24*30 ? `há ${Math.round(h/24)} d` : `há ${Math.round(h/24/30)} meses`; };
  const views = n => n==null ? '' : ' · ' + (n>=1e6 ? (n/1e6).toFixed(1)+' mi' : n>=1e3 ? Math.round(n/1e3)+' mil' : n) + ' views';
  const avatarOf = id => (feed.channels.find(c => c.channel_id === id) || {}).avatar || '';
  const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const hl = (text, q) => { if (!q) return esc(text); const i = norm(text).indexOf(q); if (i < 0) return esc(text);
    return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+q.length)) + '</mark>' + esc(text.slice(i+q.length)); };
  const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200); };

  // ---- chips de canal
  const chBar = $('#channels');
  function renderChips(){
    const pos = chBar.scrollLeft;
    chBar.innerHTML = '';
    const all = document.createElement('button');
    all.className = 'chip' + (active.size === allIds.length ? ' on' : '');
    all.textContent = 'Todos a bordo'; all.setAttribute('aria-pressed', active.size === allIds.length);
    all.onclick = () => { active = new Set(allIds); set(LS.ch, [...active]); renderChips(); render(); };
    chBar.appendChild(all);
    feed.channels.filter(c => c.channel_id).forEach(c => {
      const n = feed.videos.filter(v => v.channel_id === c.channel_id && (showShorts || !v.is_short) && (!rangeDays || now - new Date(v.published) < rangeDays*864e5)).length;
      const b = document.createElement('button'); b.className = 'chip' + (active.has(c.channel_id) ? ' on' : '');
      b.innerHTML = (c.avatar ? `<img src="${esc(c.avatar)}" alt="">` : '') + esc(c.name) + ` <span class="n">${n}</span>`;
      b.title = 'Ver vídeos de ' + c.name; b.setAttribute('aria-pressed', active.has(c.channel_id));
      b.onclick = () => { active = new Set([c.channel_id]); set(LS.ch, [...active]); renderChips(); render(); };
      chBar.appendChild(b);
    });
    chBar.scrollLeft = pos;
  }
  document.querySelectorAll('[data-range]').forEach(b => {
    b.classList.toggle('on', +b.dataset.range === rangeDays);
    b.onclick = () => { document.querySelectorAll('[data-range]').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); rangeDays = +b.dataset.range; set(LS.range, rangeDays); onlyNew = false; syncNew(); renderChips(); render(); };
  });
  const newBtn = $('#onlyNew');
  const syncNew = () => { const n = feed.videos.filter(v => isNewV(v) && (showShorts || !v.is_short)).length; newBtn.hidden = !n; $('#newN').textContent = n; newBtn.classList.toggle('on', onlyNew); };
  newBtn.onclick = () => { onlyNew = !onlyNew; syncNew(); render(); };
  syncNew();
  const togS = $('#toggleShorts');
  const syncShorts = () => { togS.classList.toggle('on', showShorts); togS.textContent = showShorts ? 'Com Shorts' : 'Sem Shorts'; };
  togS.onclick = () => { showShorts = !showShorts; set(LS.shorts, showShorts); syncShorts(); renderChips(); render(); };
  syncShorts();
  const togA = $('#toggleApp');
  const syncApp = () => { togA.classList.toggle('on', openExt); togA.textContent = openExt ? 'Abrir: no YouTube' : 'Abrir: aqui'; };
  togA.onclick = () => { openExt = !openExt; set(LS.open, openExt ? 'app' : 'aqui'); syncApp(); toast(openExt ? 'Vídeos abrem no app/site do YouTube, com seu login' : 'Vídeos abrem aqui, no player embutido'); };
  syncApp();
  $('#more').onclick = () => { limit += 120; render(true); };
  const tog = $('#toggleSeen');
  const syncTog = () => { tog.classList.toggle('on', hideSeen); tog.textContent = hideSeen ? 'Só não vistos' : 'Ocultar vistos'; };
  tog.onclick = () => { hideSeen = !hideSeen; set(LS.hide, hideSeen); syncTog(); render(); };
  $('#markAll').onclick = () => { const vs = visible(); if (!vs.length || !confirm(`Marcar ${vs.length} vídeo${vs.length>1?'s':''} como vistos?`)) return; vs.forEach(v => seen.add(v.id)); set(LS.seen, [...seen]); syncNew(); render(); toast('Tudo visto. Pode içar as velas. ⛵'); };

  // ---- busca
  const q = $('#q');
  let searchTimer; q.oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { query = norm(q.value.trim()); render(); }, 100); };
  addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q && !$('#modal').classList.contains('open')) { e.preventDefault(); q.focus(); }
    if (e.key === 'Escape') { if ($('#modal').classList.contains('open')) closePlayer(); else if (document.activeElement === q) { q.value=''; query=''; q.blur(); render(); } }
  });

  function visible(){
    return feed.videos.filter(v => active.has(v.channel_id)
      && (showShorts || !v.is_short)
      && (!onlyNew || isNewV(v))
      && (!rangeDays || query || onlyNew || now - new Date(v.published) < rangeDays*864e5)
      && (!hideSeen || !seen.has(v.id))
      && (!query || norm(v.title).includes(query) || norm(v.channel).includes(query) || norm(v.description).includes(query)));
  }

  function resetFilters(){
    active = new Set(allIds); rangeDays = 0; hideSeen = false; onlyNew = false; showShorts = true; query = ''; q.value = '';
    set(LS.ch, [...active]); set(LS.range, 0); set(LS.hide, false); set(LS.shorts, true);
    document.querySelectorAll('[data-range]').forEach(b => b.classList.toggle('on', +b.dataset.range === 0));
    syncShorts(); syncNew(); renderChips(); render();
  }
  function render(keepLimit){
    syncTog(); syncNew();
    document.querySelectorAll('.chip:not(#markAll)').forEach(b => b.setAttribute('aria-pressed', b.classList.contains('on')));
    if (!keepLimit) limit = 120;
    const all = visible(), vids = all.slice(0, limit);
    $('#more').hidden = all.length <= limit;
    $('#more').textContent = `Mostrar mais (${all.length - vids.length} restantes)`;
    const grid = $('#grid'); grid.innerHTML = '';
    $('#count').textContent = all.length;
    $('#resultSummary').textContent = `${all.length} vídeo${all.length === 1 ? '' : 's'} a bordo` + (query ? ' · busca em todo o acervo' : ' · mais recentes primeiro');
    const gen = new Date(feed.generated_at).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    const newCount = feed.videos.filter(v => lastVisit && new Date(v.published) > lastVisit && !seen.has(v.id)).length;
    $('#meta').innerHTML = `Atualizado ${gen} · a cada 3 h` + (newCount ? ` · <b>${newCount} novo${newCount>1?'s':''} desde sua última visita</b>` : '') + (feed.errors.length ? ` · <span class="warn" title="${esc(feed.errors.join('\n'))}">⚠︎ ${feed.errors.length} canal${feed.errors.length>1?'is':''} sem resposta do YouTube nesta rodada (histórico mantido)</span>` : '');
    if (!vids.length) { grid.innerHTML = `<div class="empty">${query ? 'Nenhum tesouro com “' + esc(q.value) + '” a bordo.' : 'Nada novo no horizonte, capitão. 🏴‍☠️'}<p>Tente outro canal ou amplie os filtros.</p><button class="btn" id="resetFilters">Explorar todo o acervo</button></div>`; $('#resetFilters').onclick = resetFilters; return; }
    let day = '', i = 0;
    vids.forEach(v => {
      const d = fmtDate(v.published);
      if (d !== day) { day = d; const h = document.createElement('div'); h.className = 'day'; h.textContent = d; grid.appendChild(h); }
      const isNew = isNewV(v);
      const card = document.createElement('article');
      card.className = 'card' + (seen.has(v.id) ? ' seen' : '');
      card.style.setProperty('--i', Math.min(i++, 14)); card.dataset.id = v.id;
      card.innerHTML = `
        ${isNew ? '<span class="new">NOVO</span>' : ''}${v.is_short ? '<span class="short">SHORT</span>' : ''}
        <button class="thumb" aria-label="Reproduzir ${esc(v.title)}"><img loading="lazy" src="${v.thumb}" alt=""><span class="play"><span></span></span></button>
        <div class="body">
          <img src="${esc(avatarOf(v.channel_id))}" alt="">
          <div class="txt">
            <button class="title">${hl(v.title, query)}</button>
            <div class="sub">${hl(v.channel, query)} · ${ago(v.published)}${views(v.views)}</div>
            <div class="actions">
              <button data-act="seen">${seen.has(v.id) ? 'Desmarcar visto' : 'Marcar como visto'}</button>
              <a href="${v.url}" target="_blank" rel="noopener">Abrir no YouTube ↗</a>
            </div>
          </div>
        </div>`;
      card.querySelector('[data-act=seen]').onclick = () => { seen.has(v.id) ? seen.delete(v.id) : seen.add(v.id); set(LS.seen, [...seen]); syncNew(); render(true); };
      const open = () => openExt ? card.querySelector('a').click() : openPlayer(v);   // o <a> real preserva o toque do usuário (abre o app do YouTube no iPhone)
      card.querySelector('.thumb').onclick = open;
      card.querySelector('.title').onclick = open;
      card.querySelector('a').addEventListener('click', () => markSeen(v));
      grid.appendChild(card);
    });
  }
  function markSeen(v){ if (!seen.has(v.id)) { seen.add(v.id); set(LS.seen, [...seen]); syncNew(); const c = document.querySelector(`.card[data-id="${v.id}"]`); if (c) { c.classList.add('seen'); c.querySelector('[data-act=seen]').textContent = 'Desmarcar visto'; } } }

  // ---- player embutido (usa youtube.com, então vale o login/Premium do navegador)
  const modal = $('#modal'), frame = $('#frame');
  let current = null, playlist = [], returnFocus = null, savedScroll = 0;
  function openPlayer(v, fromHistory){
    if (!modal.classList.contains('open')) { returnFocus = document.activeElement; savedScroll = window.scrollY; playlist = visible(); if (!fromHistory) history.pushState({player:1}, ''); }
    current = v;
    frame.src = `player.html?v=${encodeURIComponent(v.id)}`;   // página intermediária (ver static/player.html)
    $('#ptitle').textContent = v.title; $('#popen').href = v.url;
    $('#psub').textContent = `${v.channel} · ${ago(v.published)}${views(v.views)}`;
    const i = playlist.findIndex(x => x.id === v.id);
    $('#pprev').disabled = i <= 0; $('#pnext').disabled = i < 0 || i >= playlist.length - 1;
    modal.classList.add('open'); document.body.style.position = 'fixed'; document.body.style.top = `-${savedScroll}px`; document.body.style.width = '100%'; document.body.style.overflow = 'hidden'; document.querySelector('header').inert = true; document.querySelector('main').inert = true;
    markSeen(v); $('#pclose').focus({preventScroll:true});
  }
  function step(d){ const i = playlist.findIndex(x => x.id === current.id); const n = playlist[i + d]; if (n) openPlayer(n, true); }
  function closePlayer(fromHistory){
    if (!modal.classList.contains('open')) return;
    modal.classList.remove('open'); frame.src = 'about:blank'; document.body.style.position = ''; document.body.style.top = ''; document.body.style.width = ''; document.body.style.overflow = ''; document.querySelector('header').inert = false; document.querySelector('main').inert = false; window.scrollTo({top:savedScroll, behavior:'instant'});
    if (!fromHistory && history.state && history.state.player) history.back();
    if (returnFocus && returnFocus.isConnected) returnFocus.focus({preventScroll:true});
  }
  addEventListener('popstate', () => closePlayer(true));
  $('#pclose').onclick = () => closePlayer();
  $('#pprev').onclick = () => step(-1); $('#pnext').onclick = () => step(1);
  modal.onclick = e => { if (e.target === modal) closePlayer(); };
  addEventListener('keydown', e => { if (!modal.classList.contains('open')) return; if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });

  modal.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const items = [...modal.querySelectorAll('iframe, button:not(:disabled), a[href]')];
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  renderChips(); render();
})();
</script>
</body>
</html>
